<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #div1,
      #div2,
      #div3 {
        width: 200px;
        height: 100px;
        background-color: red;
        margin: 10px;
      }
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#slideUp").click(function () {
          $("#div1").slideUp("slow");
        });
      });

      $(document).ready(function () {
        $("#slideDown").click(function () {
          $("#div2").slideDown("fast");
        });
      });

      $(document).ready(function () {
        $("#slideToggle").click(function () {
          $("#div3").slideToggle(4000);
        });
      });
    </script>
  </head>
  <body>
    <!-- elements for show slide -->
    <div
      id="div1"
      style="width: 200px; height: 100px; background-color: red; margin: 10px"
    >
      This is a simple div 1
    </div>
    <div
      id="div2"
      style="width: 200px; height: 100px; background-color: red; margin: 10px"
    >
      This is a simple div 2
    </div>
    <div
      id="div3"
      style="width: 200px; height: 100px; background-color: red; margin: 10px"
    >
      This is a simple div 3
    </div>

    <button id="slideUp">Click me for slideUp</button>
    <button id="slideDown">Click me for slideDown</button>
    <button id="slideToggle">Click me for slideToggle</button>
  </body>
</html>
