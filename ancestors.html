<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>jQuery Animation Methods</title>

    <!-- CSS -->
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .box {
        width: 100px;
        height: 100px;
        background-color: red;
        position: relative;
        margin: 20px 0;
      }

      button {
        padding: 8px 12px;
        margin: 5px;
        cursor: pointer;
      }
    </style>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- jQuery Code -->
    <script>
      $(document).ready(function () {
        // animate()
        // Performs custom animations by changing CSS properties.
        $("#animate").click(function () {
          $(".box").animate(
            {
              left: "250px",
              opacity: 0.5,
            },
            1000,
          );
        });

        // animate() with multiple CSS properties
        $("#multiple").click(function () {
          $(".box").animate(
            {
              left: "100px",
              top: "50px",
              width: "200px",
              height: "150px",
              opacity: 0.7,
            },
            1000,
          );
        });

        // fadeOut()
        // Gradually hides the selected element.
        $("#fadeOut").click(function () {
          $(".box").fadeOut(1000);
        });

        // fadeIn()
        // Gradually displays a hidden element.
        $("#fadeIn").click(function () {
          $(".box").fadeIn(1000);
        });

        // slideUp()
        // Hides the element with an upward sliding effect.
        $("#slideUp").click(function () {
          $(".box").slideUp(1000);
        });

        // slideDown()
        // Displays the element with a downward sliding effect.
        $("#slideDown").click(function () {
          $(".box").slideDown(1000);
        });

        // stop()
        // Stops the currently running animation.
        $("#stop").click(function () {
          $(".box").stop();
        });

        // Reset the box to its original state.
        $("#reset").click(function () {
          $(".box").stop(true, true);

          $(".box").css({
            left: "0px",
            top: "0px",
            width: "100px",
            height: "100px",
            opacity: 1,
            display: "block",
          });
        });
      });
    </script>
  </head>

  <body>
    <h1>jQuery Animation Methods</h1>

    <p>Click the buttons to see different jQuery animations.</p>

    <!-- HTML Element -->
    <div class="box"></div>

    <!-- Buttons -->
    <h2>Animation Methods</h2>

    <button id="animate">animate()</button>

    <button id="multiple">Multiple Properties</button>

    <button id="fadeOut">fadeOut()</button>

    <button id="fadeIn">fadeIn()</button>

    <button id="slideUp">slideUp()</button>

    <button id="slideDown">slideDown()</button>

    <button id="stop">stop()</button>

    <button id="reset">Reset</button>
  </body>
</html>
