<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("button").click(function () {
          $("div").hide();
        });
      });

      //same works for id and class also just add # id and . for class

      //self hide
      $(document).ready(function(){
        $(".hide").click(function(){
            $(this).hide();
        });
      });
    </script>
  </head>
  <body>
    <h1>Selector</h1>
    <div>This is going to hide when button click</div>
    <button>Click me</button>
    <div class="hide">This is going to hide when clicked</div>
  </body>
</html>
