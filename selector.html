<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("button").click(function () {
          $("div").hide();
        });
      });

      //same works for id and class also just add # id and . for class

      //self hide
      $(document).ready(function () {
        $(".hide").click(function () {
          $(this).hide();
        });
      });

      //show
      $(document).ready(function () {
        $("#show").click(function () {
          $("div").show();
        });
      });

      //toggle 
      // just use .toggle() method to toggle between hide and show
        $(document).ready(function () {
            $("#toggle").click(function () {
            $("div").toggle();
            });
        });
    </script>
  </head>
  <body>
    <h1>Selector</h1>
    <div>This is going to hide when button click</div>
    <button>Click me for hide</button>
    <button id="show">Click me for show</button>
    <button id="toggle">Click me for toggle</button>
    <div class="hide">This is going to hide when clicked</div>
  </body>
</html>
